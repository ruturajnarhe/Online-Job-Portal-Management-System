spring.application.name=ojpms

# Database configuration
# Local defaults are kept so the existing development setup continues to work.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ojpms_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

server.port=${SERVER_PORT:8080}

# JWT
# Set APP_JWT_SECRET in the deployment environment.
app.jwt.secret=${APP_JWT_SECRET:OJPMS_JWT_SECRET_KEY_2026_SECURE_123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
# Local React default; replace with the deployed frontend origin in production.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Scheduler
app.scheduler.time-zone=${SCHEDULER_TIME_ZONE:Asia/Kolkata}
